<!DOCTYPE html>
<html>

<head>

<title>Volume Converter | HenryMart</title>

<link rel="stylesheet" href="../assets/css/converter.css">
<link rel="stylesheet" href="assets/css/style.css">
</head>


<body>


<header>

<nav>

<div class="logo">
HenryMart
</div>


<a class="nav-domain" href="../index.html">
Home
</a>


</nav>

</header>




<section class="converter-page">


<div class="converter-card">


<h1>
Volume Converter
</h1>


<p class="description">
Convert litres, millilitres and gallons
</p>




<div class="converter-group">


<label>
Enter Value
</label>


<input
id="inputValue"
type="number"
placeholder="Enter volume value">


</div>




<div class="converter-group">


<label>
Select Conversion
</label>



<select id="type">


<option value="liter-ml">
Liter → Milliliter
</option>


<option value="ml-liter">
Milliliter → Liter
</option>


<option value="liter-gallon">
Liter → Gallon
</option>


<option value="gallon-liter">
Gallon → Liter
</option>


</select>


</div>




<button class="convert-btn" onclick="convert()">

Convert Now

</button>



<div class="result-card">


<h3>
Converted Result
</h3>


<p id="result">
Result will appear here
</p>


</div>



</div>


</section>




<script src="../assets/js/converter.js"></script>


</body>


</html>
