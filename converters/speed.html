<!DOCTYPE html>
<html>
<head>
    <title>Speed Converter | HenryMart</title>
    <link rel="stylesheet" href="../assets/css/converter.css">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <header>
        <nav>
            <div class="logo">HenryMart</div>
            <a class="nav-domain" href="../index.html">Home</a></nav>
</header>

<section class="converter-page">
<div class="converter-card">

<h1>
Speed Converter
</h1>

<p class="description">
Convert speed between different units
</p>

<div class="converter-group">

<label>
Enter Value
</label>


<input

id="inputValue"

type="number"

placeholder="Enter speed value">



</div>







<div class="converter-group">



<label>
Select Conversion
</label>




<select id="type">





<option value="kmh-ms">

Kilometre/hour → Metre/second

</option>





<option value="ms-kmh">

Metre/second → Kilometre/hour

</option>





<option value="mph-kmh">

Miles/hour → Kilometre/hour</option>
        <option value="kmh-mph">Kilometre/hour → Miles/hour</option>
    </select>
    </div>
        <button class="convert-btn" onclick="convert()">Convert Now</button>
        <div class="result-card">
            <h3>Converted Result</h3>
            <p id="result">Result will appear here</p>
        </div>
    </div>
</section>

<script src="../assets/js/converter.js"></script>

</body>
</html>
