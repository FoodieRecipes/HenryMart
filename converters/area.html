<!DOCTYPE html>
<html>

<head>

<title>Area Converter | HenryMart</title>

<link rel="stylesheet" href="../assets/css/converter.css">
<link rel="stylesheet" href="assets/css/style.css">

</head>


<body>


<header>

<nav>

<div class="logo">
HenryMart
</div>


<a class="nav-domain" href="../index.html">
Home
</a>


</nav>

</header>




<section class="converter-page">


<div class="converter-card">


<h1>
Area Converter
</h1>


<p class="description">
Convert different area measurements
</p>



<div class="converter-group">

<label>
Enter Value
</label>


<input 
id="inputValue"
type="number"
placeholder="Enter area">


</div>




<div class="converter-group">

<label>
Select Conversion
</label>



<select id="type">


<option value="sqm-sqkm">
Square Meter → Square Kilometer
</option>


<option value="sqkm-sqm">
Square Kilometer → Square Meter
</option>


<option value="sqm-sqft">
Square Meter → Square Feet
</option>


<option value="sqft-sqm">
Square Feet → Square Meter
</option>


</select>


</div>



<button class="convert-btn" onclick="convert()">

Convert Now

</button>



<div class="result-card">

<h3>
Converted Result
</h3>


<p id="result">
Result will appear here
</p>


</div>



</div>


</section>



<script src="../assets/js/converter.js"></script>


</body>

</html>
