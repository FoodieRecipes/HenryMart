<!DOCTYPE html>
<html>


<head>


<title>Temperature Converter | HenryMart</title>


<link rel="stylesheet" href="../assets/css/converter.css">
<link rel="stylesheet" href="assets/css/style.css">


</head>



<body>



<header>


<nav>


<div class="logo">

HenryMart

</div>



<a class="nav-domain" href="../index.html">

Home

</a>



</nav>


</header>





<section class="converter-page">


<div class="converter-card">



<h1>
Temperature Converter
</h1>


<p class="description">
Convert Celsius, Fahrenheit and Kelvin
</p>




<div class="converter-group">


<label>
Enter Temperature
</label>


<input
id="inputValue"
type="number"
placeholder="Enter temperature">


</div>





<div class="converter-group">


<label>
Select Conversion
</label>



<select id="type">


<option value="c-f">
Celsius → Fahrenheit
</option>


<option value="f-c">
Fahrenheit → Celsius
</option>


<option value="c-k">
Celsius → Kelvin
</option>


<option value="k-c">
Kelvin → Celsius
</option>


</select>


</div>




<button class="convert-btn" onclick="convert()">


Convert Now


</button>





<div class="result-card">


<h3>
Converted Result
</h3>


<p id="result">

Result will appear here

</p>


</div>




</div>


</section>





<script src="../assets/js/converter.js"></script>


</body>


</html>
